name: Android Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'android_flutter/**'
      - '.github/workflows/android_flutter.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Flutter
        uses: subosito/flutter-action@48cafc24713cca54bbe03cdc3a423187d413aafa # v2.16.0
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true
      
      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Analyze code
        working-directory: android_flutter
        run: flutter analyze
      
      - name: Build APK
        working-directory: android_flutter
        run: flutter build apk --debug
      
      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: android-debug-apk
          path: android_flutter/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
